<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#650030" />
  <title>Lifeline — Life insurance, made simple</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ HEADER ============ -->
  <header class="topbar">
    <a class="brand" href="#" id="brand-home" aria-label="Lifeline home">
      <span class="orb orb-xs" data-state="idle" aria-hidden="true"><span class="orb-core"></span></span>
      <span class="brand-name">Lifeline</span>
    </a>

    <div class="topbar-actions">
      <div class="text-size" role="group" aria-label="Text size">
        <button class="ts" data-size="normal" aria-pressed="true" aria-label="Normal text">A</button>
        <button class="ts ts-lg" data-size="large" aria-pressed="false" aria-label="Large text">A</button>
        <button class="ts ts-xl" data-size="xlarge" aria-pressed="false" aria-label="Extra large text">A</button>
      </div>
      <button class="btn btn-outline" id="new-chat-btn" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        <span>New chat</span>
      </button>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="app">
    <!-- Home -->
    <section class="home" id="home" aria-labelledby="home-title">
      <div class="orb orb-hero" data-state="idle" aria-hidden="true"><span class="orb-core"></span></div>

      <h1 id="home-title"><span id="greeting">Hello</span>.<br />How can I help you today?</h1>
      <p class="lead">Ask me anything about life insurance, in your own words.</p>

      <button class="btn btn-primary btn-xl" id="voice-cta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
        Talk to Lifeline
      </button>

      <div class="topics" role="list">
        <button class="topic" role="listitem" data-prompt="I'd like to get a quote for life insurance.">
          <span>Get a quote</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button class="topic" role="listitem" data-prompt="Can you help me understand my current policy?">
          <span>Understand my policy</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button class="topic" role="listitem" data-prompt="How do I make a claim?">
          <span>Make a claim</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button class="topic" role="listitem" data-prompt="Can I speak to a real person?">
          <span>Speak to a person</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>
    </section>

    <!-- Chat -->
    <section class="chat" id="chat" aria-label="Conversation" hidden>
      <ol class="messages" id="messages" aria-live="polite"></ol>
    </section>
  </main>

  <!-- ============ COMPOSER ============ -->
  <footer class="composer-wrap">
    <form class="composer" id="composer" autocomplete="off">
      <label for="message-input" class="sr-only">Type your question</label>
      <textarea id="message-input" rows="1" placeholder="Type your question…"></textarea>
      <button type="button" class="icon-btn" id="voice-btn" aria-label="Talk instead of typing" title="Talk instead of typing">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
      </button>
      <button type="submit" class="btn btn-primary" id="send-btn" disabled>
        <span class="send-label">Send</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
      </button>
    </form>
    <p class="fineprint">Private and secure · You can ask for a real person at any time</p>
  </footer>

  <!-- ============ VOICE MODE ============ -->
  <div class="voice" id="voice" role="dialog" aria-modal="true" aria-labelledby="voice-status" hidden>
    <div class="voice-inner">
      <div class="orb orb-voice" id="voice-orb" data-state="listening" aria-hidden="true"><span class="orb-core"></span></div>

      <h2 class="voice-status" id="voice-status" aria-live="assertive">Listening</h2>
      <p class="voice-transcript" id="voice-transcript" aria-live="polite">Go ahead, I'm listening.</p>

      <div class="voice-controls">
        <button class="btn btn-outline btn-lg" id="mute-btn" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-mic"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-mic-off"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5 2.2M15 10V6a3 3 0 0 0-5.7-1.3M5 11a7 7 0 0 0 11.5 5.3M12 18v3" /></svg>
          <span>Mute</span>
        </button>
        <button class="btn btn-primary btn-lg" id="end-voice-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          <span>End</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ TEST PANEL (dev only) ============ -->
  <aside class="devpanel" aria-label="Testing controls">
    <button class="devpanel-toggle" id="devpanel-toggle" aria-expanded="false">Test</button>
    <div class="devpanel-body" id="devpanel-body" hidden>
      <p>Mock only — nothing is connected.</p>
      <div class="devpanel-group">
        <span>Chat</span>
        <button data-dev="user">User message</button>
        <button data-dev="reply">AI reply</button>
        <button data-dev="thinking">Thinking</button>
        <button data-dev="stop">Stop thinking</button>
        <button data-dev="long">Long reply</button>
        <button data-dev="error">Error</button>
        <button data-dev="clear">Home</button>
      </div>
      <div class="devpanel-group">
        <span>Voice</span>
        <button data-dev="v-listen">Listening</button>
        <button data-dev="v-think">Thinking</button>
        <button data-dev="v-speak">Speaking</button>
        <button data-dev="v-auto">Auto demo</button>
      </div>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
